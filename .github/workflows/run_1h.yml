name: Gold 1H Bot

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python gold_robot_1h.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save last signal
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_signal_1h.txt || true
          git diff --cached --quiet || (git commit -m "update 1h signal" && git pull --rebase && git push)
